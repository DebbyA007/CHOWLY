<text x="62" y="212" class="line" fill="#9a9287">Order at your table. The kitchen promises a time. The ring keeps it.</text>
<text x="62" y="240" class="line" fill="#9a9287">The Golden Gate, 13 Ubah Street, Berger, Lagos</text>
