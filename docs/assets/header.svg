<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
<title id="t">CHOWLY</title>
<desc id="d">The CHOWLY mark, an open ochre ring with a dot in its opening, beside the name set in Newsreader as outlines on a warm near-black ground, and an ochre ring that empties as a promised wait is used, then turns late red, then starts again.</desc>
<style>
  .line { font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; }
  .arc { stroke: #d2a24c; stroke-dasharray: 515.2; stroke-dashoffset: 0; animation: wait 24s linear infinite; }
  .num { font-family: "Space Grotesk", system-ui, sans-serif; font-size: 40px; font-weight: 500; letter-spacing: -1.2px; fill: #f0ebe1; animation: tone 24s linear infinite; }
  @keyframes wait { 0% { stroke-dashoffset: 0; stroke: #d2a24c; } 80% { stroke-dashoffset: 515.2; stroke: #d2a24c; } 86% { stroke-dashoffset: 0; stroke: #c9482f; } 96% { stroke-dashoffset: 0; stroke: #c9482f; } 100% { stroke-dashoffset: 0; stroke: #d2a24c; } }
  @keyframes tone { 0%, 80% { fill: #f0ebe1; } 86%, 96% { fill: #c9482f; } 100% { fill: #f0ebe1; } }
  @media (prefers-reduced-motion: reduce) { .arc { animation: none; stroke-dashoffset: 128.8; } .num { animation: none; } }
</style>
<rect width="1200" height="300" fill="#14120f"/>
<g fill="#f0ebe1">
  <circle cx="90" cy="40" r="0.9" fill-opacity="0.05"/><circle cx="310" cy="70" r="0.8" fill-opacity="0.04"/><circle cx="560" cy="30" r="0.9" fill-opacity="0.05"/><circle cx="220" cy="250" r="0.8" fill-opacity="0.04"/><circle cx="700" cy="270" r="0.9" fill-opacity="0.05"/><circle cx="1120" cy="60" r="0.8" fill-opacity="0.04"/><circle cx="450" cy="120" r="0.7" fill-opacity="0.04"/>
</g>
<!-- the mark, from public/brand/mark.svg, at 46 percent of the wordmark's cap height -->
<g transform="translate(60 92.5) scale(0.36)">
  <path d="M 67.78 75.39 A 31 31 0 1 1 67.78 24.61" fill="none" stroke="#D2A24C" stroke-width="11" stroke-linecap="round"/>
  <circle cx="81" cy="50" r="5.5" fill="#D2A24C"/>
</g>
